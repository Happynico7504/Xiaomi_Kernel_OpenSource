name: "Release Pipeline"
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: "ubuntu-24.04"
    # a hanging download shouldn't hold the runner for GitHub's default 6 hours
    timeout-minutes: 60
    env:
      # wget gives up on a stalled connection after a minute instead of 15,
      # and says in one line what it fetched
      WGET: "wget -nv --timeout=60 --tries=5"
    steps:

    - uses: "actions/checkout@v2"
    - run: echo "SHORT_SHA=`echo ${GITHUB_SHA} | cut -c1-7`" >> $GITHUB_ENV
    - name: "Fetch the ccache and the out of tree modules"
      run: |
        sudo $WGET https://github.com/Happynico7504/Xiaomi_Kernel_OpenSource/releases/download/autobuild/ccache.tar.gz || true
        sudo tar -xf ccache.tar.gz || true
        sudo $WGET https://github.com/Happynico7504/MTK_kernel_modules/archive/refs/heads/ice-s-oss.zip || true
        sudo unzip -q ice-s-oss.zip 2> /dev/null || true
        sudo cp -r MTK_kernel_modules-ice-s-oss/* drivers/misc/nicochristmann/mtkmods || true
        sudo $WGET https://github.com/Happynico7504/88x2bu-20210702/archive/refs/heads/main.zip || true
        sudo unzip -q main.zip 2> /dev/null || true
        sudo mkdir drivers/misc/nicochristmann/usbwifi/src || true
        sudo cp -r 88x2bu-20210702-main/* drivers/misc/nicochristmann/usbwifi/src || true
    - name: "Fetch clang 11"
      run: |
        sudo $WGET https://github.com/llvm/llvm-project/releases/download/llvmorg-11.0.1/clang+llvm-11.0.1-x86_64-linux-gnu-ubuntu-20.10.tar.xz && sudo xzcat clang+llvm-11.0.1-x86_64-linux-gnu-ubuntu-20.10.tar.xz | sudo tar -x
    - name: "Install the build dependencies"
      run: |
        sudo apt-get update -qq -o Acquire::http::Timeout=60
        sudo apt-get install -y -qq -o Acquire::http::Timeout=60 binutils gcc-arm-linux-gnueabi gcc-aarch64-linux-gnu build-essential git flex bison libssl-dev bc libgmp-dev libmpc-dev jq wget curl unzip ccache > /dev/null
    - name: "Set up the compiler wrappers and the build directory"
      run: |
        sudo mv clang+llvm-11.0.1-x86_64-linux-gnu-ubuntu-20.10/bin/clang clang+llvm-11.0.1-x86_64-linux-gnu-ubuntu-20.10/bin/clang-real
        sudo mv clang+llvm-11.0.1-x86_64-linux-gnu-ubuntu-20.10/bin/clang++ clang+llvm-11.0.1-x86_64-linux-gnu-ubuntu-20.10/bin/clang++-real
        sudo cp custom-scripts/clang clang+llvm-11.0.1-x86_64-linux-gnu-ubuntu-20.10/bin
        sudo cp custom-scripts/clang++ clang+llvm-11.0.1-x86_64-linux-gnu-ubuntu-20.10/bin
        sudo chmod 755 custom-scripts/clang clang+llvm-11.0.1-x86_64-linux-gnu-ubuntu-20.10/bin/clang
        sudo chmod 755 custom-scripts/clang++ clang+llvm-11.0.1-x86_64-linux-gnu-ubuntu-20.10/bin/clang++
        sudo ls clang+llvm-11.0.1-x86_64-linux-gnu-ubuntu-20.10/bin
        nproc
        mkdir build-out
        sudo mv .config build-out/.config
    - run: "sudo USE_CCACHE=1 CCACHE_DIR=/home/runner/work/Xiaomi_Kernel_OpenSource/Xiaomi_Kernel_OpenSource/ccache PATH=$(pwd)/clang+llvm-11.0.1-x86_64-linux-gnu-ubuntu-20.10/bin:$PATH COMPILERSETTINGS=\"\" LINKERSETTNGS=\"-z nodefs\" ARCH=arm64 ARCH_MTK_PLATFORM=mt6761 CROSS_COMPILE=aarch64-linux-gnu- LLVM=1 KERNEL_DIR=$(pwd) KBUILD_OUTPUT=build-out CLANG_PREBUILT_BIN=$(pwd)/clang+llvm-11.0.1-x86_64-linux-gnu-ubuntu-20.10/bin LINUX_GCC_CROSS_COMPILE_PREBUILTS_BIN=/usr/bin CC=clang LD=ld.lld LLVM_LD=ld.lld AR=llvm-ar NM=llvm-nm OBJCOPY=llvm-objcopy OBJDUMP=llvm-objdump READELF=llvm-readelf OBJSIZE=llvm-size STRIP=llvm-strip make -j$(($(nproc) * 4)) || true"
    - run: "sudo USE_CCACHE=1 CCACHE_DIR=/home/runner/work/Xiaomi_Kernel_OpenSource/Xiaomi_Kernel_OpenSource/ccache PATH=$(pwd)/clang+llvm-11.0.1-x86_64-linux-gnu-ubuntu-20.10/bin:$PATH COMPILERSETTINGS=\"\" LINKERSETTNGS=\"-z nodefs\" ARCH=arm64 ARCH_MTK_PLATFORM=mt6761 CROSS_COMPILE=aarch64-linux-gnu- LLVM=1 KERNEL_DIR=$(pwd) KBUILD_OUTPUT=build-out CLANG_PREBUILT_BIN=$(pwd)/clang+llvm-11.0.1-x86_64-linux-gnu-ubuntu-20.10/bin LINUX_GCC_CROSS_COMPILE_PREBUILTS_BIN=/usr/bin CC=clang LD=ld.lld LLVM_LD=ld.lld AR=llvm-ar NM=llvm-nm OBJCOPY=llvm-objcopy OBJDUMP=llvm-objdump READELF=llvm-readelf OBJSIZE=llvm-size STRIP=llvm-strip make -k INSTALL_MOD_PATH=$(pwd)/modinst modules_install || true"
    - run: "sudo rm -f modinst/lib/modules/*/build modinst/lib/modules/*/source || true"
    - run: "for d in modinst/lib/modules/*/; do sudo touch $d/modules.builtin.modinfo; done || true"
    - run: "sudo tar -C modinst -c lib | gzip -9 > modules.tar.gz || true"
    - run: "sudo cat build-out/.config | gzip -9 > config.gz || true"
    - run: "sudo sh custom-scripts/package-headers.sh build-out || true"
    - run: "sudo rm ccache.tar.gz || true"
    - run: "sudo tar -c ccache | gzip -9 > ccache.tar.gz || true"
    - run: |
        sudo sha512sum build-out/arch/arm64/boot/Image.gz | sudo tee build-out/arch/arm64/boot/Image.gz.sha512 || true
        sudo sha512sum build-out/System.map > build-out/System.map.sha512 || true
        sudo sha512sum config.gz > config.gz.sha512 || true
        sudo sha512sum modules.tar.gz > modules.tar.gz.sha512 || true
        sudo sha512sum headers.tar.gz > headers.tar.gz.sha512 || true
        sudo sha512sum ccache.tar.gz > ccache.tar.gz.sha512 || true
    - run: "[ ! -s build-out/System.map.sha512 ] && sudo rm build-out/System.map.sha512 || true"
    - run: "[ ! -s build-out/arch/arm64/boot/Image.gz.sha512 ] && sudo rm build-out/arch/arm64/boot/Image.gz.sha512 || true"
    - uses: "marvinpinto/action-automatic-releases@latest"
      with:
        repo_token: "${{ secrets.GITHUB_TOKEN }}"
        automatic_release_tag: "autobuild"
        prerelease: true
        title: "Automatic build ${{ env.SHORT_SHA }}"
        files: |
          ccache.tar.gz
          ccache.tar.gz.sha512
          build-out/arch/arm64/boot/Image.gz
          build-out/arch/arm64/boot/Image.gz.sha512
          build-out/System.map
          build-out/System.map.sha512
          config.gz
          config.gz.sha512
          modules.tar.gz
          modules.tar.gz.sha512
          headers.tar.gz
          headers.tar.gz.sha512
